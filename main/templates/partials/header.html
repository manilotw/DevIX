{% load static %}
<header class="header header--{{ theme|default:'light' }}" id="header">
  <div class="container header__inner">
    <!-- Logo -->
    <a href="/" class="logo">
      <img src="{% static 'img/devixsvg.svg' %}" alt="DevIX">
      <span class="logo__name">DEVIX</span>
    </a>

    <div class="header__menu" id="headerMenu">
      <!-- Navigation -->
      <nav class="nav">
        <div class="nav__drop">
          <button type="button" class="nav__toggle" data-i18n="nav_services">Услуги</button>
          <div class="nav__sub">
            <a href="/#services" data-i18n="nav_sub_web">Разработка сайтов</a>
            <a href="/services/landing" data-i18n="svc1_title">Лендинги</a>
            <a href="/services/online-store" data-i18n="svc3_title">Интернет-магазины</a>
            <a href="/services/corporate" data-i18n="svc2_title">Корпоративные сайты</a>
            <a href="/telegram-bots" data-i18n="nav_telegram">Telegram Боты</a>
            <a href="/services/ai-agents" data-i18n="svc7_title">AI-агенты</a>
            <a href="/services/web-apps" data-i18n="svc4_title">Веб-приложения</a>
            <a href="/services/automation" data-i18n="svc6_title">Автоматизация бизнес-процессов</a>
            <a href="/services/diploma" data-i18n="svc8_title">Дипломный проект</a>
          </div>
        </div>
        <a href="/portfolio" data-i18n="nav_portfolio">Портфолио</a>
        <a href="/aboutus" data-i18n="nav_about">О нас</a>
        <a href="/calculator" data-i18n="nav_pricing">Стоимость</a>
        <a href="/contacts" data-i18n="nav_contacts">Контакты</a>
      </nav>

      <div class="header__right">
        <!-- Language Selector -->
        <div class="lang">
          <button type="button" class="lang-selector-btn" data-lang="ru" onclick="switchLanguage('ru')">RU</button>
          <button type="button" class="lang-selector-btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
        </div>

        <a href="#contact" class="btn {% if theme == 'dark' %}btn--outline-white{% else %}btn--outline{% endif %}" data-i18n="nav_cta">Связаться</a>
      </div>
    </div>

    <!-- Mobile: contact button and menu toggle -->
    <a href="#contact" class="btn header__cta {% if theme == 'dark' %}btn--outline-white{% else %}btn--outline{% endif %}" data-i18n="nav_cta">Связаться</a>
    <button type="button" class="burger" id="burger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
